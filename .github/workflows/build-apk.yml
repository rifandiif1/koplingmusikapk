name: Build Koplingfy APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publikasikan APK langsung untuk update otomatis Koplingfy"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Auto-Publish Koplingfy APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compute Auto Version & Release Metadata
        id: version
        run: |
          RUN_NUM="${GITHUB_RUN_NUMBER:-1}"
          VERSION_CODE=$((100 + RUN_NUM))
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="1.0.${RUN_NUM}"
            RELEASE_TAG="v${VERSION_NAME}"
          fi
          COMMIT_MSG="$(git log -1 --pretty=%s 2>/dev/null || echo 'Pembaruan terbaru Koplingfy')"
          # Sanitize backticks/newlines for safe markdown body
          COMMIT_MSG_SAFE="$(printf '%s' "$COMMIT_MSG" | tr '\r\n' ' ' | sed 's/`//g')"

          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "commit_msg=${COMMIT_MSG_SAFE}" >> "$GITHUB_OUTPUT"
          echo "Auto-versioning build: ${RELEASE_TAG} (versionCode=${VERSION_CODE})"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK & Accept Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || find "$SDK_DIR/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_DIR" >&2
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" --install "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Debug Keystore & Environment
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '\r\n' < debug.keystore.base64 | base64 --decode > debug.keystore
            elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Koplingfy,C=ID"
            fi
          fi
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n' | base64 --decode > app/google-services.json
            fi
          fi
          if [ -f app/google-services.json ]; then
            rm -f app/src/main/res/values/ci_google_services_fallback.xml
          else
            echo "Note: app/google-services.json not found; generating CI compile fallback for default_web_client_id."
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<resources>' \
              '    <string name="default_web_client_id" translatable="false"></string>' \
              '</resources>' \
              > app/src/main/res/values/ci_google_services_fallback.xml
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        env:
          APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect Debug APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Koplingfy-v${VERSION_NAME}.apk"
          ls -lh dist/

      - name: Build Signed Release APK (Optional)
        env:
          APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            KEYSTORE_PATH="$PWD/my-upload-key.jks" gradle :app:assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "dist/Koplingfy-v${APP_VERSION_NAME}-release.apk"
            rm -f my-upload-key.jks
            ls -lh dist/
          else
            echo "Release keystore secrets not configured; skipping signed release APK."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Koplingfy-v${{ steps.version.outputs.version_name }}-APK
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Auto-Publish APK for In-App Auto-Update
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: Koplingfy ${{ steps.version.outputs.release_tag }}
          body: |
            Pembaruan otomatis **Koplingfy ${{ steps.version.outputs.release_tag }}** (Build #${{ steps.version.outputs.version_code }}).

            - Catatan perubahan: ${{ steps.version.outputs.commit_msg }}
            - Ketuk tombol Unduh APK untuk langsung memperbarui tanpa kehilangan data.
          files: dist/*.apk
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
